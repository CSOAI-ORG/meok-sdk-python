[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "meok-sdk"
version = "0.1.0"
description = "Official Python SDK for the MEOK Attestation API — sign + verify HMAC-signed compliance attestations across the MEOK trade-compliance ecosystem."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "meok",
  "compliance",
  "attestation",
  "hmac",
  "eu-ai-act",
  "uk-ai-bill",
  "fleet-compliance",
  "dvsa",
  "fors",
  "trade-compliance",
]
authors = [
  { name = "Nicholas Templeman", email = "nicholas@meok.ai" },
]
maintainers = [
  { name = "MEOK AI Labs / CSOAI LTD", email = "nicholas@meok.ai" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
async = ["anyio>=4.0"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]
dev  = ["ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage      = "https://haulage.app"
Documentation = "https://meok-attestation-api.vercel.app/docs"
Repository    = "https://github.com/CSOAI-ORG/meok-sdk-python"
Issues        = "https://github.com/CSOAI-ORG/meok-sdk-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["meok_sdk"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
